name: qMusic Build & Release

on:
  workflow_dispatch:
    inputs:
      lyrics_gesture_check:
        description: 'Check only horizontal lyric-area drags and repeated scrolling'
        type: boolean
        default: false
      full_validation:
        description: 'Run the full simulator and decoded-audio regression (slower)'
        type: boolean
        default: false
      profile_player_resources:
        description: 'With full validation: measure simulator CPU/RSS (not battery power)'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - '.github/release-version'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - codex/liquid-glass-controls
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: iphone-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check build and release tools
        run: python3 -m unittest discover -s BuildTools -p 'test_*.py'

  # Expensive native regressions are opt-in, never enabled by PR body text.
  full-validation:
    if: github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.full_validation
    needs: tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify actual decoded audio after FLAC seeks
        run: bash BuildTools/test-audio-seeking.sh
      - name: Validate iPhone UI and library tests
        run: bash BuildTools/test-iphone-changes.sh
      - name: Profile player resources on simulator (not battery power)
        if: inputs.profile_player_resources
        run: python3 BuildTools/profile-player-resources.py
      - name: Upload diagnostic logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-validation-${{ github.run_number }}
          path: |
            build/validation/*.log
            build/validation/audio-seek/*.log
            build/resource-profile/*.json
            build/resource-profile/*.csv
          if-no-files-found: ignore
          retention-days: 3


  build:
    needs: tests
    # Standard hosted runners are free for public repositories only.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Check lyric-area gestures when explicitly requested or their test changes
        env:
          FOCUSED_LYRICS_CHECK: ${{ inputs.lyrics_gesture_check }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_EVENT: ${{ github.event_name }}
        run: |
          requested="$FOCUSED_LYRICS_CHECK"
          if [[ "$CHECK_EVENT" == pull_request ]]; then
            git diff --name-only "$CHECK_SHA^" "$CHECK_SHA" -- BuildTools/PlayerTouchTests.swift BuildTools/test-lyrics-gesture.sh > "$RUNNER_TEMP/lyrics-gesture-changes"
            if [[ -s "$RUNNER_TEMP/lyrics-gesture-changes" ]]; then requested=true; fi
          fi
          if [[ "$requested" == true ]]; then bash BuildTools/test-lyrics-gesture.sh; fi

      - name: Build unsigned device IPA
        run: |
          bash BuildTools/build-unsigned-ipa.sh

      - name: Upload IPA and installation instructions
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-iPhone-unsigned-${{ github.run_number }}
          path: |
            build/sideload/Amperfy-unsigned.ipa
            build/sideload/SHA256SUMS
            build/sideload/build-info.txt
            build/sideload/ipa-integrity.log
            BuildTools/verify_ipa.py
            docs/iphone-install-zh.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amperfy-build-log-${{ github.run_number }}
          path: |
            build/sideload/build.log
            build/lyrics-gesture/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show next steps
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## iPhone 测试包已生成
          下载本次运行的 **Amperfy-iPhone-unsigned** artifact，解压后找到 `Amperfy-unsigned.ipa`。

          这是 **iOS 26+ 真机包**，还需要在 Windows 爱思助手中使用自己的 Apple ID 签名后安装。
          免费个人签名通常有效 7 天。本测试包不包含 Siri / CarPlay 授权。
          Apple ID 和密码不需要上传到 GitHub。

          安装步骤见压缩包内的 `iphone-install-zh.md`；具体构建版本见 `build-info.txt`。
          EOF

  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    needs: [tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Resolve release version
        id: version
        env:
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          tag="$TAG_REF"
          if [[ -z "$tag" ]]; then tag="$(cat .github/release-version)"; fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release version: $tag" >&2
            exit 1
          fi
          test -f "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Amperfy-iPhone-unsigned-${{ github.run_number }}
          path: build/release-input
      - name: Verify release version, source and IPA
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 BuildTools/prepare-release.py build/release-input build/release "$RELEASE_TAG" "$(git rev-parse HEAD)"
          python3 BuildTools/verify_ipa.py --require-signature "build/release/qMusic-${RELEASE_TAG#v}.ipa"
      - name: Create release tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" --method POST \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
          notes="docs/releases/$RELEASE_TAG.md"
          title="$(head -n 1 "$notes" | sed 's/^# //')"
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" build/release/* \
            --verify-tag --title "$title" --notes-file "$notes" "${flags[@]}"
