name: qMusic Lyrics Motion Check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  lyrics:
    runs-on: xcode-27
    timeout-minutes: 24
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p build/validation
          xcrun simctl list runtimes
          device=$(xcrun simctl create 'qMusic Lyrics' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-27-2)
          xcrun simctl boot "$device"
          echo "LYRIC_TEST_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Compile the simulator app
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild build -project Amperfy.xcodeproj -scheme Amperfy -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/validation/DerivedData -onlyUsePackageVersionsFromResolvedFile \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=30 -Xfrontend -warn-long-expression-type-checking=1000' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee build/validation/test.log
      - name: Verify player and timed lyrics
        timeout-minutes: 12
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$LYRIC_TEST_DEVICE" -b
          app=build/validation/DerivedData/Build/Products/Debug-iphonesimulator/Amperfy.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          bash BuildTools/smoke-iphone-login.sh "$LYRIC_TEST_DEVICE" "$app" "$bundle"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qMusic-lyrics-simulator-292
          path: |
            build/validation/test.log
            build/validation/player.*.log
            build/validation/player-lyrics-*.png
            build/validation/simulator.log
            build/validation/crashes/
          retention-days: 7
